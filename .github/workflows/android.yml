name: Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Dry-run the whole packaging path on a branch: builds and uploads the APK
  # as a workflow artifact, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      # Mobile specs import @pear/core, which resolves to core/dist.
      - name: Build core
        run: npm run build -w core

      - name: Core tests
        run: npm test -w core

      - name: Mobile tests
        run: npm test -w mobile

      # The ssh-engine suite drives a real scratch sshd (ScratchSshd spawns
      # /usr/sbin/sshd with its own config — no service needed).
      - name: Install sshd for the engine tests
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: ssh-engine JVM tests
        working-directory: mobile/android/ssh-engine
        run: ./gradlew test --no-daemon

  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    # The `secrets` context can't be used in a step-level `if:`, so surface the
    # keystore flag through `env` (which secrets can populate) and gate on that.
    # Absent secrets → the release APK builds unsigned (see app/build.gradle).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Android SDK is preinstalled on ubuntu-latest; only the JDK needs
      # pinning (the ssh-engine composite targets 17 from any 17+ toolchain).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      # The tag drives versionName so v1.2.3 ships as 1.2.3 with no committed
      # bump; versionCode is monotonic from the run number for Play upgrades.
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: |
          sed -i "s/versionName \".*\"/versionName \"${GITHUB_REF_NAME#v}\"/" mobile/android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" mobile/android/app/build.gradle

      - name: Build web app and sync Capacitor
        run: npm run mobile:sync

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pear-release.keystore"

      # APK for GitHub-release sideloading, AAB for Play Store upload — Play
      # requires an App Bundle for new apps; one gradle invocation signs both
      # with the same config.
      - name: Assemble release APK + AAB
        env:
          PEAR_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/pear-release.keystore', runner.temp) || '' }}
          PEAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p release-apk
          apk=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls mobile/android/app/build/outputs/bundle/release/*.aab | head -1)
          cp "$apk" "release-apk/pear-${GITHUB_REF_NAME:-dev}.apk"
          cp "$aab" "release-apk/pear-${GITHUB_REF_NAME:-dev}.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pear-android
          path: |
            release-apk/*.apk
            release-apk/*.aab
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The desktop workflow may not have created the release yet — make
        # sure it exists, then attach.
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" release-apk/*.apk --clobber
